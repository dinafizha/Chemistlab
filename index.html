html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;color:#3b2a1a}

<script>
/* ============================================================
   CHEMISTLAB — 100% client-side (tanpa backend / database)
   Struktur: [1] Util  [2] Data game  [3] Penyimpanan & Login
   [4] Audio  [5] Navigasi/HUD  [6] Meja uji & reaksi  [7] Menu lain
   ============================================================ */
const $=s=>document.querySelector(s);
/* [1] UTIL */
// Ubah angka rumus jadi subscript: H2O -> H<sub>2</sub>O
const chem=t=>t.replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>');
// localStorage aman (jika diblokir, pakai memori sementara)
const mem={};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
          set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
          del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
/* ===== Skala & orientasi layar =====
   Game dirancang landscape. Di HP yang dipegang portrait, tampilan diputar 90° otomatis (ROT = true).
   Di layar kecil, bingkai tablet disembunyikan (class "compact") supaya game memenuhi layar. */
let S=1,ROT=false;
function fit(){
  const vw=innerWidth,vh=innerHeight,coarse=matchMedia('(pointer:coarse)').matches;
  ROT=vh>vw&&(coarse||vw<=500);
  const w=ROT?vh:vw,h=ROT?vw:vh;                                   // ukuran layar landscape virtual
  const compact=Math.min(w,h)<700||(coarse&&Math.min(w,h)<900);
  document.documentElement.classList.toggle('compact',compact);
  const bw=compact?1100:1376,bh=compact?628:768;
  S=Math.min(w/bw,h/bh);
  $('#stage').style.transform=`translate(-50%,-50%)${ROT?' rotate(90deg)':''} scale(${S})${compact?' translate(0,-10px)':''}`}
addEventListener('resize',fit);fit();
let tt;function toast(m,ms=2200){const t=$('#toast');t.innerHTML=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',ms)}
function modal(h){$('#mbody').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}

let U=null,D=null;
const newData=()=>({coins:10,gems:10,lv:1,disc:{},own:{},hint:0,done:{},master:{},exam:{},avatar:0,avs:{0:1}});
const dkey=u=>'chemistlab_data_'+u.trim().toLowerCase();
function loadUser(){U=ls.get('chemistlab_user');if(!U)return false;
  let raw=ls.get(dkey(U));if(!raw)raw=ls.get('chemistlab_data_'+U); // data lama sebelum nama dinormalisasi
  try{D=JSON.parse(raw)}catch(e){D=null}
  D=Object.assign(newData(),D||{});
  ['disc','own','done','master','exam','avs'].forEach(k=>{if(!D[k]||typeof D[k]!=='object')D[k]={}});

/* ===== PENYIMPANAN =====
   Online  : data disimpan di MySQL lewat api.php (tabel users & users_inventory) -> bisa login dari device lain.
   Offline : jika api.php tidak ada/tidak bisa diakses, otomatis memakai localStorage. */
const API='api.php';let ONLINE=false,svT=null;
async function api(body,ms=4000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body),signal:c.signal});return await r.json()}
  finally{clearTimeout(t)}}
// D (data game) <-> kode inventory di tabel users_inventory
function toInv(){const c=['gems:'+D.gems,'hint:'+D.hint,'avsel:'+D.avatar];
  Object.keys(D.own).forEach(k=>D.own[k]&&c.push('own:'+k));
  Object.keys(D.avs).forEach(k=>D.avs[k]&&c.push('avatar:'+k));
  Object.keys(D.disc).forEach(k=>c.push('disc:'+k+':'+D.disc[k]));
  Object.keys(D.master).forEach(k=>c.push('master:'+k));
  Object.keys(D.exam).forEach(k=>D.exam[k]&&c.push('exam:'+k));
  Object.keys(D.done).forEach(k=>D.done[k]&&c.push('done:'+k));return c}
function fromInv(lv,coins,inv){const d=newData();d.lv=lv;d.coins=coins;
  (inv||[]).forEach(c=>{const p=c.split(':'),v=p[1];switch(p[0]){
    case 'gems':d.gems=+v;break;case 'hint':d.hint=+v;break;case 'avsel':d.avatar=+v;break;
    case 'own':d.own[v]=1;break;case 'avatar':d.avs[v]=1;break;case 'disc':d.disc[v]=+p[2]||1;break;
    case 'master':d.master[v]=1;break;case 'exam':d.exam[v]=1;break;case 'done':d.done[v]=1}});
  d.avs[0]=1;if(!d.avs[d.avatar])d.avatar=0;return d}
function applyServerUser(j){U=j.user.username;D=fromInv(j.user.level,j.user.coins,j.inv);ONLINE=true;ls.set(dkey(U),JSON.stringify(D))}
async function pushSave(){if(!ONLINE||!U||!D)return;try{await api({action:'save',level:D.lv,coins:D.coins,inv:toInv()})}catch(e){}}
const save=()=>{if(!(U&&D))return;ls.set(dkey(U),JSON.stringify(D));if(ONLINE){clearTimeout(svT);svT=setTimeout(pushSave,500)}};
addEventListener('pagehide',()=>{if(!(U&&D))return;ls.set(dkey(U),JSON.stringify(D));
  if(ONLINE&&navigator.sendBeacon)try{navigator.sendBeacon(API,new Blob([JSON.stringify({action:'save',level:D.lv,coins:D.coins,inv:toInv()})],{type:'application/json'}))}catch(e){}});
let regMode=false;
const hashPw=x=>{let h=5381;for(const c of 'cl|'+x)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};   // hanya untuk mode offline
function toggleReg(){regMode=!regMode;$('#li2').style.display=regMode?'flex':'none';$('#pw2').value='';

// Daftar: akun baru dibuat di database MySQL (offline: di localStorage), setelah itu baru bisa masuk
async function register(){
  const n=$('#un').value.trim(),pw=$('#pw').value,pw2=$('#pw2').value;
  if(n.length<3){toast('Username minimal 3 karakter');return}
  if(pw.length<4){toast('Kata sandi minimal 4 karakter');return}
  if(pw!==pw2){toast('Kata sandi dan ulangi kata sandi belum sama');return}
  play('pop');
  try{const j=await api({action:'register',username:n,password:pw});
    if(j&&j.ok){afterRegister(n);return}
    if(j&&j.error){toast(j.error,3000);return}}
  catch(e){}
  const k='chemistlab_acc_'+n.toLowerCase();                       // mode offline
  if(ls.get(k)||ls.get(dkey(n))){toast('Username sudah dipakai');return}
  ls.set(k,hashPw(pw));afterRegister(n)}
// Masuk: hanya untuk akun yang sudah terdaftar
async function login(){
  const n=$('#un').value.trim(),pw=$('#pw').value;
  if(!n){toast('Isi username dulu');return}
  startAudio();play('pop');
  try{const j=await api({action:'login',username:n,password:pw});
    if(j&&j.ok){applyServerUser(j);go('menu');toast('Selamat datang, '+U+'!');return}
    if(j&&j.error){toast(j.error,3000);return}}
  catch(e){}
  ONLINE=false;                                                    // mode offline (localStorage)
  const k='chemistlab_acc_'+n.toLowerCase(),acc=ls.get(k);
  if(!acc){
    if(ls.get(dkey(n))){ls.set(k,hashPw(pw))}                      // akun lama sebelum ada fitur daftar
    else{toast('Akun belum terdaftar. Silakan daftar dulu.',3000);return}
  }else if(acc!==hashPw(pw)){toast('Kata sandi salah',3000);return}
  ls.set('chemistlab_user',n);loadUser();go('menu')}
async function logout(){
  if(ONLINE){clearTimeout(svT);await pushSave();try{await api({action:'logout'})}catch(e){}}
  else save();
  ls.del('chemistlab_user');U=D=null;closeModal();bgm(false);$('#un').value='';$('#pw').value='';go('login')}

/* [4] AUDIO — suara sintetis bawaan (tanpa file).
   Untuk memakai file sendiri, isi path pada AF, contoh: pop:'audio/pop.mp3' */
const AF={pop:'',splash:'',success:'',fail:'',bgm:''};
let AC,sfxOn=true,musOn=true,bgmT,bgmEl,stp=0;
const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f1,f2,d,type='sine',v=.15,t0=0){const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,v){const a=ac(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=900;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const SFX={
  pop(){tone(500,950,.1)},                                   // klik tombol
  splash(){tone(420,110,.2,'triangle',.22)},                  // botol masuk gelas
  success(){[0,.13,.26].forEach((t,i)=>tone(300+i*160,520+i*200,.12,'sine',.15,t));[784,988,1319].forEach((f,i)=>tone(f,f,.6,'sine',.1,.5+i*.08))}, // bloop + lonceng
  fail(){noise(.45,.6);tone(220,50,.3,'sawtooth',.08)}        // poof
};
function play(n){if(!sfxOn)return;try{if(AF[n]){new Audio(AF[n]).play();return}SFX[n]()}catch(e){}}
const NOTE=[523,587,659,784,880,784,659,587];
function bgm(on){clearInterval(bgmT);if(bgmEl){bgmEl.pause();bgmEl=null}
  if(!on||!musOn)return;
  try{if(AF.bgm){bgmEl=new Audio(AF.bgm);bgmEl.loop=true;bgmEl.volume=.4;bgmEl.play();return}
  bgmT=setInterval(()=>{const f=NOTE[stp%8]*(stp%16<8?1:.75);tone(f,f,.28,'triangle',.035);if(stp%4==0)tone(f/4,f/4,.5,'sine',.05);stp++},320)}catch(e){}}
function startAudio(){try{ac().resume()}catch(e){}bgm(true)}

const SHOP=[{id:'stir',n:'Pengaduk Cepat',p:100,i:'<svg viewBox="0 0 64 64" width="84" height="84"><ellipse cx="22" cy="20" rx="13" ry="16" transform="rotate(-35 22 20)" fill="#c7bdd9" stroke="#8b7aa8" stroke-width="3"/><path d="M31 31L55 55" stroke="#8b7aa8" stroke-width="6" stroke-linecap="round"/></svg>',d:'Reaksi lebih cepat & +5 koin tiap misi'},{id:'avatar',n:'Avatar',p:150,i:'<img alt="" style="width:92px;height:92px;border-radius:50%;border:3px solid #F5B21E;background:#fff;object-fit:cover;object-position:center 15%" src="'+AVS[2]+'">',d:'Pilih karakter untuk foto profilmu'},{id:'hint',n:'Paket Hint ×3',p:50,i:'<svg viewBox="0 0 64 64" width="84" height="84"><path d="M32 6a17 17 0 00-9 31c2 2 3 4 3 7h12c0-3 1-5 3-7A17 17 0 0032 6z" fill="#ffd54a" stroke="#d9a000" stroke-width="3"/><path d="M26 50h12M27 56h10" stroke="#8b7aa8" stroke-width="4" stroke-linecap="round"/></svg>',d:'Tunjukkan suhu & tekanan target'}];
const COIN='<svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="#F5B21E" stroke="#C98300" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#C98300" stroke-width="1.8"/></svg>';
function drawShop(){$('#shopitems').innerHTML=SHOP.map((s,k)=>`<div class="it" style="left:${150+k*280}px"><div class="in"><div class="slot">${s.i}</div><h3>${s.n}</h3><p>${s.d}${s.id=='hint'?`<br><b>Jatahmu: ${D.hint}</b>`:''}</p>${D.own[s.id]&&s.id!='hint'&&s.id!='avatar'?'<b class="own">Dimiliki</b>':`<button class="btn yellow buy" onclick="buy('${s.id}')">${COIN} ${s.p}</button>`}</div></div>`).join('')}
/* Avatar: klik harga -> muncul pilihan karakter -> pilih -> Purchase (100 koin) */
function openAv(sel){play('pop');const own=!!D.avs[sel];
  const grid=AVS.map((u,i)=>`<button class="avo${i===sel?' sel':''}${D.avs[i]?' own':''}" onclick="openAv(${i})" aria-label="Avatar ${i+1}"><img alt="" src="${u}"></button>`).join('');
  const act=own?(sel===D.avatar?'<button class="btn gray" disabled>Sedang dipakai</button>':`<button class="btn green" onclick="useAv(${sel})">Pakai</button>`):`<button class="btn yellow" onclick="purchaseAv(${sel})">Purchase · ${COIN} 150</button>`;
  modal(`<h2>Pilih Avatar</h2><div class="avg">${grid}</div><div class="row">${act}<button class="btn gray" onclick="closeModal()">Batal</button></div>`)}
function useAv(i){D.avatar=i;save();hud();closeModal();toast('Avatar diganti')}
function purchaseAv(i){if(D.avs[i]){useAv(i);return}
  if(D.coins<150){toast('Koin belum cukup. Selesaikan misi untuk dapat koin!');return}
  D.coins-=150;D.avs[i]=1;D.avatar=i;save();hud();closeModal();toast('Avatar baru berhasil dibeli dan dipakai')}
function buy(id){const s=SHOP.find(x=>x.id==id);play('pop');if(id==='avatar'){openAv(D.avatar);return}
  if(D.coins<s.p){toast('Koin belum cukup. Selesaikan misi untuk dapat koin!');return}
  D.coins-=s.p;if(id=='hint')D.hint+=3;else D.own[id]=1;save();hud();drawShop();toast('Dibeli: '+s.n)}

// Slider vertikal berbasis pointer (benar walau stage diskalakan)
function slider(el,f0,cb){const set=f=>cb(Math.max(0,Math.min(1,f)));
  const mv=e=>{const r=el.getBoundingClientRect();set(ROT?(e.clientX-r.left)/r.width:1-(e.clientY-r.top)/r.height)};
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);mv(e);el.onpointermove=mv});
  el.addEventListener('pointerup',()=>el.onpointermove=null);set(f0);return set}
let setTf;
function nudgeT(d){setTf(((T+d)+10)/131);play('pop')}
function buildGameUI(){
  // Temperature: skala linear -10 s/d 121 °C (tanpa label kategori, pemain harus ingat dari Compendium)
  const tb=$('#tbar');tb.innerHTML='<div class="mark" id="tm"></div>';
  $('#tticks').innerHTML=[121,100,75,50,25,0,-10].map(v=>`<i style="top:${(121-v)/131*100}%">${v}°</i>`).join('');
  setTf=slider(tb,32/131,f=>{T=Math.round(-10+131*f);$('#tm').style.top=(1-f)*100+'%';
    $('#plate').classList.toggle('hot',T>30);$('#tlabel').textContent=T+' °C'});
  tb.addEventListener('wheel',e=>{e.preventDefault();setTf((T+(e.deltaY<0?1:-1)+10)/131)},{passive:false});
  tb.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();setTf((T+(e.key==='ArrowUp'?1:-1)+10)/131)}});
  // Pressure 0.5–3.0 bar
  slider($('#pbar'),.2,f=>{P=Math.round((.5+f*2.5)*10)/10;$('#pfill').style.height=f*100+'%';$('#pro').textContent=P.toFixed(1)+' bar'});
  // Rak reagen
  $('#inv').innerHTML=SHELF.map(id=>`<div class="bt" data-id="${id}"><svg viewBox="0 0 84 74"><rect x="32" y="1" width="20" height="11" rx="3" fill="#8a5a2b"/><rect x="35" y="10" width="14" height="8" fill="${R[id]}" opacity=".75"/><rect x="6" y="16" width="72" height="56" rx="14" fill="${R[id]}" stroke="#fff" stroke-width="2"/><rect x="10" y="34" width="64" height="20" rx="5" fill="#fff" opacity=".92"/></svg><i${id.includes(' ')?' class="l2"':''}>${chem(id)}</i></div>`).join('');
  document.querySelectorAll('.bt').forEach(el=>drag(el,el.dataset.id));
}
// Drag botol -> gelas. Tap/klik biasa juga memasukkan reagen (untuk layar sentuh)
function drag(el,id){el.addEventListener('pointerdown',e=>{e.preventDefault();
  const g=el.cloneNode(true);g.classList.add('ghost');g.style.width='98px';g.style.transformOrigin='0 0';g.style.transform=`scale(${S*1.05}) rotate(${ROT?96:6}deg)`;document.body.appendChild(g);
  const place=ev=>{if(ROT){g.style.left=ev.clientX+50*S+'px';g.style.top=ev.clientY-49*S+'px'}else{g.style.left=ev.clientX-49*S+'px';g.style.top=ev.clientY-50*S+'px'}};place(e);
  let moved=0;const sx=e.clientX,sy=e.clientY;
  const mv=ev=>{moved=Math.hypot(ev.clientX-sx,ev.clientY-sy);place(ev)};
  const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);g.remove();
    const r=$('#beaker').getBoundingClientRect();
    if(moved<8||(ev.clientX>r.left-30&&ev.clientX<r.right+30&&ev.clientY>r.top-60&&ev.clientY<r.bottom+30))addR(id)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up)})}
function addR(id){if(busy)return;
  if(B.includes(id)){toast('Reagen itu sudah ada di gelas');return}
  if(B.length>=3){toast('Maksimal 3 reagen per gelas');return}
  B.push(id);play('splash');drawBeaker()}
function avg(cs){const v=cs.map(h=>[1,3,5].map(k=>parseInt(h.substr(k,2),16)));return '#'+[0,1,2].map(k=>Math.round(v.reduce((a,b)=>a+b[k],0)/v.length).toString(16).padStart(2,'0')).join('')}
function drawBeaker(){
  const l=$('#liq');
  if(!B.length)l.style.height='0';
  else{const cs=B.map(i=>R[i]);const c=avg(cs);
    l.style.height=(24+B.length*20)+'%';l.style.background=`linear-gradient(color-mix(in srgb,${c},#fff 35%),${c})`}
  $('#chips').innerHTML=B.map(i=>`<button onclick="B.splice(B.indexOf('${i}'),1);drawBeaker()" title="Keluarkan">${chem(i)} ✕</button>`).join('')}
function clearBeaker(sound){if(busy)return;B=[];drawBeaker();if(sound)play('pop')}
// Partikel efek reaksi
function fx(kind,color,n){const box=$('#fx');for(let i=0;i<n;i++){const p=document.createElement('i'),big=kind=='m'?34+Math.random()*40:kind=='B'?10+Math.random()*20:6+Math.random()*14;
  p.className='p '+kind;p.style.cssText=`left:${30+Math.random()*110}px;bottom:${50+Math.random()*60}px;width:${big}px;height:${big}px;--c:${color};--x:${(Math.random()-.5)*(kind=='f'?40:100)}px;--y:${kind=='f'?20+Math.random()*60:-(90+Math.random()*130)}px;--d:${1.2+Math.random()*1.4}s;animation-delay:${Math.random()*.7}s`;
  box.appendChild(p);setTimeout(()=>p.remove(),3400)}}
const FXN={b:16,B:34,m:12,f:22};
function action(){if(busy)return;play('pop');
  if(!B.length){toast('Seret reagen ke dalam gelas dulu!');return}
  busy=true;$('#stir').classList.add('on');
  setTimeout(()=>{$('#stir').classList.remove('on');evaluate()},D.own.stir?600:1300)}
// Cek sistem reaksi: reagen cocok + suhu dalam zona + tekanan sesuai
function evaluate(){
  const key=[...B].sort().join('+');
  const cands=RX.map((x,i)=>i).filter(i=>[...RX[i].r].sort().join('+')==key);
  const okc=cands.filter(i=>{const x=RX[i],[lo,hi]=Z[x.z];return T>=lo&&T<=hi&&Math.abs(P-x.p)<.15});
  if(okc.length)win(okc.includes(cur.i)?cur.i:okc[0]);
  else lose(cands.length?RX[cands[0]]:null)}
function win(ri){const x=RX[ri];
  $('#liq').style.height='70%';$('#liq').style.background=`linear-gradient(color-mix(in srgb,${x.color},#fff 35%),${x.color})`;
  fx(x.fx,x.color,FXN[x.fx]);fx('b','#ffffff',8);play('success');
  if(cur.mode==='exam'){examHit(ri);return}
  const cid=x.cid,first=!D.disc[cid];D.disc[cid]=(D.disc[cid]||0)+1;if(first)D.gems++;
  const isTarget=cur.mode==='story'&&cur.i===ri;let coins=0;
  if(isTarget){coins=(!D.done[cur.i]?20:8)+(D.own.stir?5:0);D.done[cur.i]=1;D.coins+=coins;
    if(cur.mode==='story'&&cur.i+2>D.lv)D.lv=Math.min(RX.length,cur.i+2)}
  save();hud();stopTimer();
  setTimeout(()=>{
    const info=`<div class="big" style="background:${x.color}"></div><p><b>${chem(x.f)}</b><br>${x.name}</p><p style="font-size:16px">${chem(x.info)}</p>`;
    if(isTarget){const nx=cur.mode==='story'&&cur.i<RX.length-1;
      modal(`<h2>Misi Selesai!</h2>${info}<p>+${coins} koin${first?' · +1 permata · tercatat di Compendium':''}</p><div class="row">${nx?`<button class="btn green" onclick="closeModal();startLevel(${cur.i+1},'story')">Level berikutnya</button>`:''}<button class="btn gray" onclick="closeModal();go('menu')">Menu</button></div>`)
    }else modal(`<h2>Senyawa Ditemukan!</h2>${info}<p style="font-size:16px">${cur.mode==='sand'?'Tercatat di Compendium.':'Benar, tapi bukan target misi ini.'}</p><div class="row"><button class="btn green" onclick="closeModal();clearBeaker()">Lanjut</button></div>`);
    busy=false;clearBeaker()},1700)}
function megaBoom(){const b=$('#boom'),cols=['#4b5563','#6b7280','#fb923c','#f97316','#fde047','#374151'];
  let h='<div class="fl"></div>';
  for(let i=0;i<46;i++){const a=Math.random()*6.283,d=150+Math.random()*650,z=140+Math.random()*180;
    h+=`<i class="bp" style="left:${550-z/2}px;top:${340-z/2}px;width:${z}px;height:${z}px;background:${cols[i%6]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d*.7}px;--s:${1.2+Math.random()*1.8};--d:${1.1+Math.random()*.8}s"></i>`}
  b.innerHTML=h+'<div class="bx">BOOM!</div>';b.style.display='block';
  const sc=$('#screen');sc.classList.add('shake');
  setTimeout(()=>{b.style.display='none';b.innerHTML='';sc.classList.remove('shake')},1900)}
function lose(x,msg){
  const ex=cur.mode==='exam'?EX:null,qi=ex&&ex.i;if(ex)ex.att++;
  megaBoom();play('fail');const b=$('#beaker');b.classList.add('boom');$('#poof').style.display='block';
  $('#liq').style.height='80%';$('#liq').style.background='linear-gradient(#FF8A00,#8B5CF6)'; // lumpur gagal
  fx('m','#6b7280',14);fx('m','#fb923c',10);fx('b','#ffffff',10);
  setTimeout(()=>{if(ex&&(EX!==ex||EX.i!==qi))return;
    b.classList.remove('boom');$('#poof').style.display='none';busy=false;clearBeaker();
    if(ex){if(ex.att>=2)failQ('Kesempatan habis, soal terlewat');else toast('Salah! Sisa kesempatan: '+(2-ex.att),2600);return}
    toast(msg||(x?'Reagen sudah benar, tetapi suhu atau tekanan belum tepat!':'Campuran ini tidak menghasilkan reaksi yang kamu cari'),3200)},2000)}
// Perkecil font banner sampai seluruh teks muat di dalam border (font & ketebalan tetap seragam)
function fitBanner(){const t=$('#mtxt'),sb=$('#msub');let f=27;t.style.fontSize=f+'px';
  while(f>13&&(t.offsetHeight+sb.offsetHeight)>80){f--;t.style.fontSize=f+'px'}}
function stopTimer(){clearInterval(tmr);tmr=null}
/* Hint hanya di mode PLAY (story): konfirmasi dulu + tampilkan jatah hint */
function hint(){if(cur.mode!=='story')return;play('pop');
  if(D.hint<1){modal(`<h2>Hint</h2><p>Jatah hint kamu sudah habis.</p><p>Beli Paket Hint di Shop.</p><div class="row"><button class="btn yellow" onclick="closeModal();go('shop')">Ke Shop</button><button class="btn gray" onclick="closeModal()">Tutup</button></div>`);return}
  modal(`<h2>Pakai Hint?</h2><p>Apakah kamu yakin ingin memakai jatah hint kamu?</p><p>Jatah hint kamu: <b>${D.hint}</b></p><div class="row"><button class="btn green" onclick="useHint()">Ya, pakai</button><button class="btn gray" onclick="closeModal()">Batal</button></div>`)}
function useHint(){closeModal();const x=RX[cur.i],[lo,hi]=Z[x.z];D.hint--;save();hud();
  toast(`${ZN[x.z]} (${lo===hi?lo:lo+'–'+hi} °C) · Tekanan ${x.p.toFixed(1)} bar (sisa hint ${D.hint})`,4200)}
function enterGame(mode){$('#beaker').classList.toggle('glow',!!D.own.beaker);$('#hintb').style.display=mode==='story'?'flex':'none';hud()}
function startLevel(i,mode){play('pop');stopTimer();EX=null;cur={i,mode};B=[];busy=false;drawBeaker();enterGame(mode);
  const x=RX[i];
  $('#mtxt').innerHTML=mode==='sand'?'Mode Bebas: campurkan apa saja!':chem(x.txt);
  $('#msub').textContent=mode==='sand'?'Temukan senyawa baru untuk Compendium':`${ZN[x.z]} · Tekanan ${x.p.toFixed(1)} bar`;
  go('game');fitBanner()}

/* ===== MODE UJIAN: per 5 level (1-5, 6-10, ... 26-30) =====
   Soal hanya "buatlah campuran yang menghasilkan ..." tanpa bahan/suhu/tekanan.
   90 detik & 2 kesempatan per soal. Lulus jika benar >= 3 dari 5.
   Jawaban benar mengisi penuh bar Compendium senyawa tsb. */
let EX=null;
const doneCount=()=>RX.reduce((n,x,i)=>n+((D.done[i]||i+1<D.lv)?1:0),0);
const found=()=>Math.max(Object.keys(D.disc).length,doneCount());   // progres ujian
const doneUpTo=n=>found()>=n;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function examEntry(){play('pop');
  const k=[1,2,3,4,5,6].find(n=>!D.exam[n]);
  if(!k){modal(`<h2>Ujian</h2><p>Semua ujian sudah kamu selesaikan. Hebat!</p><div class="row"><button class="btn gray" onclick="closeModal()">Tutup</button></div>`);return}
  const a=k*5-4,b=k*5;
  if(!doneUpTo(b)){modal(`<h2>Ujian Belum Tersedia</h2><p>Ujian level ${a}–${b} baru bisa dikerjakan setelah kamu menemukan ${b} senyawa atau menyelesaikan ${b} level.</p><p>Progres: <b>${found()}/${b}</b></p><div class="row"><button class="btn gray" onclick="closeModal()">Tutup</button></div>`);return}
  const later=k<6&&doneUpTo(b+5);
  modal(`<h2>Ujian Level ${a}–${b}</h2>${later?`<p>Kamu sudah menemukan cukup senyawa untuk ujian berikutnya, tapi ujian ini dari level ${a}–${b} dulu ya.</p>`:''}<p style="font-size:17px">5 soal · 90 detik per soal · 2 kesempatan per soal.<br>Tidak ada petunjuk bahan, suhu, atau tekanan.<br>Lulus jika benar minimal 3 soal.</p><div class="row"><button class="btn green" onclick="startExam(${k})">Mulai</button><button class="btn gray" onclick="closeModal()">Batal</button></div>`)}
function startExam(k){closeModal();stopTimer();EX={k,qs:shuf([0,1,2,3,4].map(n=>k*5-5+n)),i:0,score:0,res:[],att:0,tl:90};go('game');startQuestion()}
function examSub(){const m=Math.floor(EX.tl/60),r=String(EX.tl%60).padStart(2,'0');$('#msub').textContent=`Soal ${EX.i+1}/5 · ${m}:${r} · Kesempatan ${2-EX.att}`}
function startQuestion(){stopTimer();const q=EX.qs[EX.i];cur={i:q,mode:'exam'};EX.att=0;EX.tl=90;B=[];busy=false;drawBeaker();
  $('#beaker').classList.remove('boom');$('#poof').style.display='none';enterGame('exam');
  $('#mtxt').innerHTML=`Buatlah campuran yang menghasilkan ${chem(RX[q].qn||RX[q].name)}`;examSub();fitBanner();
  tmr=setInterval(()=>{if($('#modal').classList.contains('on'))return;EX.tl--;examSub();if(EX.tl<=0)failQ('Waktu habis!')},1000)}
function failQ(msg){stopTimer();EX.res.push(0);busy=true;toast(msg||'Soal terlewat',1800);setTimeout(nextQ,1900)}
function nextQ(){EX.i++;if(EX.i>=5)endExam();else startQuestion()}
function examHit(ri){const ex=EX,qi=ex.i,q=ex.qs[qi];
  if(RX[ri].cid===RX[q].cid){stopTimer();ex.score++;ex.res.push(1);D.master[RX[ri].cid]=1;save();busy=true;toast('Benar!',1600);setTimeout(nextQ,2000);return}
  ex.att++;examSub();
  setTimeout(()=>{if(EX!==ex||ex.i!==qi)return;busy=false;clearBeaker();
    if(ex.att>=2)failQ('Kesempatan habis, soal terlewat');
    else toast(`Itu menghasilkan ${RX[ri].name}, bukan yang diminta. Sisa kesempatan: ${2-ex.att}`,3000)},1500)}
function endExam(){stopTimer();const E=EX,pass=E.score>=3,a=E.k*5-4,b=E.k*5;
  const coins=E.score*10+(pass?20:0);if(pass){D.exam[E.k]=1;D.gems+=2}D.coins+=coins;save();hud();
  const rows=E.qs.map((q,n)=>`<div style="display:flex;justify-content:space-between;font-size:17px;padding:3px 12px;background:${E.res[n]?'#e8f9ee':'#fdecec'};border-radius:10px;margin:3px 0"><span>${RX[q].qn||RX[q].name}</span><b>${E.res[n]?'Benar':'Salah'}</b></div>`).join('');
  modal(`<h2>${pass?'Ujian Lulus!':'Belum Lulus'}</h2><p>Level ${a}–${b} · Nilai <b>${E.score}/5</b></p>${rows}<p style="font-size:16px">+${coins} koin${pass?' · +2 permata':''}<br>Bar Compendium terisi penuh untuk senyawa yang kamu jawab benar.</p><div class="row">${pass?'':`<button class="btn green" onclick="startExam(${E.k})">Ulangi Ujian</button>`}<button class="btn gray" onclick="closeModal();go('menu')">Menu</button></div>`);
  EX=null}

/* ============ INISIALISASI ============ */
buildGameUI();
// Auto-login: cek session di localStorage
// Awal: cek sesi database; jika tidak ada server, pakai localStorage
(async()=>{
  try{const j=await api({action:'me'},3000);ONLINE=!!(j&&j.ok);
    if(ONLINE&&j.user){applyServerUser(j);go('menu');return}}catch(e){ONLINE=false}
  if(!ONLINE&&loadUser())go('menu');else go('login')})();
addEventListener('pointerdown',function f(){if(U)startAudio();removeEventListener('pointerdown',f)});
$('#s-login').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitAuth()}});
</script>
